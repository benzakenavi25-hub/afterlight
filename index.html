<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b241e" />
    <script src="%BASE_URL%script.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232b241e'/%3E%3Cpath d='M6 19h20' stroke='%23AD8967' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <title>AFTERLIGHT — פנטהאוז מול האופק | פרויקט קונספט</title>
    <meta
      name="description"
      content="AFTERLIGHT — פרויקט קונספט של Benzaken Studio: אתר נכס יוקרה לפנטהאוז בדיוני מול האופק."
    />
    <!-- Hero poster preload. Keep in sync with the hero poster in src/data/media.ts
         (tour-01-entry = first frame of the tour master; tour-01-entry-vertical = first frame of the
         vertical film, phone portrait only — same query as VERTICAL_QUERY in TourHero.tsx). -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 62.5rem), (orientation: landscape)"
      imagesrcset="%BASE_URL%media/tour-01-entry-640.avif 640w, %BASE_URL%media/tour-01-entry-960.avif 960w, %BASE_URL%media/tour-01-entry-1280.avif 1280w, %BASE_URL%media/tour-01-entry-1920.avif 1920w"
      imagesizes="(max-aspect-ratio: 16/9) 178vh, 100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 62.49rem) and (orientation: portrait)"
      imagesrcset="%BASE_URL%media/tour-01-entry-vertical-480.avif 480w, %BASE_URL%media/tour-01-entry-vertical-720.avif 720w, %BASE_URL%media/tour-01-entry-vertical-1080.avif 1080w"
      imagesizes="(max-aspect-ratio: 9/16) 56.25vh, 100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
