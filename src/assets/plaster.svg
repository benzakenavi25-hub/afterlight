<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Seamless mineral-plaster tile, grey around 50%: meant for mix-blend-mode overlay on the warm base.
       Broad troweled clouds + mid mottling + fine grain; every noise is stitched and the filter region
       is pinned to the tile, so repeats have no seam. Strength is set by the page: the plaster-texture token in tokens.css. -->
  <filter id="p" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0039" numOctaves="4" seed="11" stitchTiles="stitch" result="cloud"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="4" stitchTiles="stitch" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="2" stitchTiles="stitch" result="grain"/>
    <feComposite in="cloud" in2="mottle" operator="arithmetic" k2="0.5" k3="0.5" result="tone"/>
    <feComposite in="tone" in2="grain" operator="arithmetic" k2="0.74" k3="0.26" result="all"/>
    <feColorMatrix in="all" type="matrix" values="2.4 0 0 0 -0.62  2.4 0 0 0 -0.7  2.4 0 0 0 -0.8  0 0 0 0 1"/>
  </filter>
  <rect width="1024" height="1024" filter="url(#p)"/>
</svg>
